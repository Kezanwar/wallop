services:
  postgres:
    image: postgres:17
    container_name: wallop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallop_user
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: wallop_database
    ports:
      - "5432:5432"
    volumes:
      - wallop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallop_user -d wallop_database"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wallop-pgdata:
